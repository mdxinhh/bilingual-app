<!DOCTYPE html>
<html lang="zh-CN">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>双语对话 3.0</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{--bg:#0d0f14;--panel:#161a22;--panel2:#1d222c;--border:#262c38;--text:#e9edf5;--muted:#7c869a;--accent:#4c8dff;--ok:#2ecc71;--err:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.view{display:none;flex:1;flex-direction:column;overflow:hidden}
.view.on{display:flex}
#loginView{align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;max-width:380px}
.login-card h1{font-size:22px;margin:0 0 6px;text-align:center}
.login-card p{color:var(--muted);font-size:13px;text-align:center;margin:0 0 22px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 13px;font-size:15px;outline:none}
.field input:focus{border-color:var(--accent)}
.btn-primary{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-primary:disabled{opacity:.4}
.btn-ghost{width:100%;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:13px;cursor:pointer;margin-top:8px}
.login-msg{font-size:12px;text-align:center;margin-top:10px;min-height:16px}
.login-msg.err{color:var(--err)}
.login-msg.ok{color:var(--ok)}
#roomsView{padding:14px;overflow-y:auto}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--border);padding-top:calc(10px + env(safe-area-inset-top));flex-shrink:0}
.topbar .title{font-weight:600;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-ico{background:var(--panel2);border:1px solid var(--border);color:var(--muted);min-width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0 10px}
.section-title{font-size:13px;color:var(--muted);margin:16px 0 8px;font-weight:600}
.room-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px}
.room-item .name{font-weight:600;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-item .code{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--accent);background:rgba(76,141,255,.12);padding:2px 7px;border-radius:6px}
.del-room{background:transparent;border:1px solid #4a3238;color:#a06773;border-radius:6px;width:26px;height:26px;cursor:pointer;padding:0;font-size:12px;display:flex;align-items:center;justify-content:center}
.empty-tip{text-align:center;color:var(--muted);padding:32px 20px;font-size:13px;line-height:1.7}
.create-btn{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px;width:100%;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
#roomView{flex-direction:column}
.room-body{flex:1;display:flex;overflow:hidden}
.room-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.sidebar{width:0;transition:width .2s;overflow:hidden;background:var(--panel);border-left:1px solid var(--border)}
.sidebar.on{width:260px}
.sidebar-inner{padding:12px;width:260px;height:100%;overflow-y:auto}
.member-item{display:flex;align-items:center;gap:8px;padding:8px 6px;border-radius:8px;font-size:13px;margin-bottom:2px}
.member-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.member-dot.online{background:var(--ok)}
.member-dot.offline{background:var(--muted)}
.member-dot.muted{background:var(--err)}
.member-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.member-role{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;flex-shrink:0}
.member-role.owner{color:#ffb020;background:rgba(255,176,32,.14);border:1px solid rgba(255,176,32,.35)}
.member-role.admin{color:var(--accent);background:rgba(76,141,255,.14);border:1px solid rgba(76,141,255,.35)}
.member-actions{display:flex;gap:3px;flex-shrink:0}
.member-actions button{background:transparent;border:1px solid var(--border);color:var(--muted);width:24px;height:24px;border-radius:6px;font-size:11px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.chat{flex:1;overflow-y:auto;padding:12px 10px 16px;display:flex;flex-direction:column;gap:12px}
.msg{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:11px 13px;position:relative}
.msg.own{border-color:rgba(76,141,255,.35)}
.msg-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;color:var(--muted)}
.msg-header .who{font-weight:600;color:var(--text)}
.msg-header .time{margin-left:auto}
.row{display:flex;align-items:flex-start;gap:8px}
.row+.row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.chip{flex-shrink:0;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;margin-top:4px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 32%,transparent);white-space:nowrap}
.toks{flex:1;display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px 0;min-width:0}
.tok{display:inline-flex;flex-direction:column;align-items:center;padding:0 2px;cursor:pointer;user-select:none;border-radius:6px}
.tok .w{font-size:16.5px;line-height:1.32;padding:1px 3px;border-radius:4px;transition:.15s}
.tok .bar{width:100%;height:2px;border-radius:2px;background:var(--c);opacity:.85;margin-top:1px;min-width:14px}
.tok .n{font-size:9.5px;line-height:12px;color:var(--c);font-weight:700;opacity:.88}
.tok[data-k="-1"]{opacity:.5}
.tok.hl .w{background:var(--c);color:#0d0f14;font-weight:700}
.tok.speaking .w{color:var(--accent);text-shadow:0 0 8px rgba(76,141,255,.6)}
.acts{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.acts button{background:transparent;border:1px solid var(--border);color:var(--muted);width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:12px;padding:0}
.del-msg{position:absolute;top:8px;right:8px;background:rgba(30,36,48,.7);border:1px solid #3a4356;color:#7c869a;border-radius:5px;width:24px;height:24px;cursor:pointer;font-size:11px;padding:0;opacity:.5;display:flex;align-items:center;justify-content:center}
.msg:hover .del-msg,.msg .del-msg:active{opacity:1}
.composer{background:var(--panel);border-top:1px solid var(--border);padding:9px 10px calc(24px + env(safe-area-inset-bottom));flex-shrink:0}
.speakers{display:flex;gap:6px;margin-bottom:8px}
.spk{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:9px;padding:7px 6px;font-size:12px;font-weight:600;cursor:pointer}
.spk.active{color:var(--accent);border-color:var(--accent);background:rgba(76,141,255,.12)}
.inputline{display:flex;gap:7px;align-items:center}
#txt{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:11px;padding:11px 13px;font-size:16px;outline:none;min-width:0}
.mic,.send{flex-shrink:0;width:44px;height:44px;border-radius:11px;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mic{background:var(--panel2);border:1px solid var(--border);color:var(--muted)}
.mic.rec{background:#ff4757;border-color:#ff4757;color:#fff}
.send{background:var(--accent);color:#fff}
.send:disabled{opacity:.32}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-bg.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px;max-width:380px;width:100%;text-align:center}
.modal h3{margin:0 0 6px;font-size:17px}
.modal p{color:var(--muted);font-size:13px;margin:0 0 16px}
#qrWrap{background:#fff;padding:14px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;width:208px;height:208px;box-sizing:border-box}
#qrImg{display:block;width:180px;height:180px;object-fit:contain}
#inviteLink{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px;font-family:ui-monospace,monospace;color:var(--accent);word-break:break-all;margin-bottom:12px;user-select:all}
.role-option{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin:6px 0;background:var(--panel2);border:1px solid var(--border);border-radius:12px;color:var(--text);cursor:pointer;font-size:14px;text-align:left}
.role-option .icon{font-size:20px}
.role-option .info{flex:1;text-align:left}
.role-option .info .name{font-weight:600;margin-bottom:2px}
.role-option .info .desc{font-size:11px;color:var(--muted);line-height:1.4}
#toast{position:fixed;bottom:calc(110px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,36,48,.96);color:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 16px;font-size:13px;opacity:0;transition:.22s;pointer-events:none;z-index:999;max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<body>

<div id="loginView" class="view on">
  <div class="login-card">
    <h1>🗣 双语对话 3.0</h1>
    <p>注册或登录开始使用</p>
    <div class="field"><label>邮箱</label><input id="authEmail" type="email" placeholder="you@example.com"></div>
    <div class="field"><label>密码</label><input id="authPassword" type="password" placeholder="至少 6 位"></div>
    <div class="field"><label>昵称（仅注册时填）</label><input id="authName" type="text" placeholder="你的名字"></div>
    <button id="btnLogin" class="btn-primary">登录</button>
    <button id="btnRegister" class="btn-ghost">注册新账号</button>
    <div id="loginMsg" class="login-msg"></div>
  </div>
</div>

<div id="roomsView" class="view">
  <div class="topbar">
    <div class="title" id="userName">…</div>
    <button id="btnJoin" class="btn-ico">加入</button>
    <button id="btnLogout" class="btn-ico">退出</button>
  </div>
  <div style="padding:14px">
    <button id="btnCreateRoom" class="create-btn">+ 创建新房间</button>
    <div class="section-title">我的房间</div>
    <div id="roomList"></div>
  </div>
</div>

<div id="roomView" class="view">
  <div class="topbar">
    <button id="btnLeave" class="btn-ico">←</button>
    <div class="title" id="roomTitle">…</div>
    <button id="btnInvite" class="btn-ico">邀请</button>
    <button id="btnClearRoom" class="btn-ico" title="清空消息">🧹</button>
    <button id="btnSidebar" class="btn-ico">👥</button>
  </div>
  <div class="room-body">
    <div class="room-main">
      <div id="chat" class="chat"></div>
      <div class="composer">
        <div class="speakers" id="speakers">
          <button class="spk active" data-side="A"></button>
          <button class="spk" data-side="B"></button>
        </div>
        <div class="inputline">
          <input id="txt" type="text" placeholder="输入或说话…">
          <button id="btnFile" class="mic" title="上传文件">📎</button>
          <button id="btnMic" class="mic">🎤</button>
          <button id="btnSend" class="send" disabled>↑</button>
        </div>
      </div>
    </div>
    <div id="sidebar" class="sidebar">
      <div class="sidebar-inner">
        <div class="section-title">成员</div>
        <div id="memberList"></div>
      </div>
    </div>
  </div>
</div>

<div id="inviteModal" class="modal-bg">
  <div class="modal">
    <h3>邀请成员</h3>
    <p>扫码或分享链接加入房间</p>
    <div id="qrWrap"><img id="qrImg" alt="QR"></div>
    <div id="inviteLink"></div>
    <button id="btnCopyLink" class="btn-primary">复制邀请链接</button>
    <button id="btnCloseInvite" class="btn-ghost">关闭</button>
  </div>
</div>

<div id="joinModal" class="modal-bg">
  <div class="modal">
    <h3>加入房间</h3>
    <p>输入 6 位邀请码</p>
    <div class="field"><input id="joinCode" type="text" maxlength="6" placeholder="ABC123" style="text-align:center;letter-spacing:4px;font-size:20px;font-family:monospace"></div>
    <button id="btnJoinConfirm" class="btn-primary">加入</button>
    <button id="btnJoinCancel" class="btn-ghost">取消</button>
  </div>
</div>

<div id="roleModal" class="modal-bg">
  <div class="modal">
    <h3>设置权限</h3>
    <p id="roleModalTarget">—</p>
    <button class="role-option" data-role="member">
      <span class="icon">👤</span>
      <div class="info"><div class="name">普通成员</div><div class="desc">可发送消息、查看成员</div></div>
    </button>
    <button class="role-option" data-role="admin">
      <span class="icon">🛡</span>
      <div class="info"><div class="name">管理员</div><div class="desc">可禁言、移出成员、删除消息</div></div>
    </button>
    <button id="btnRoleCancel" class="btn-ghost">取消</button>
  </div>
</div>

<div id="toast"></div>
<input id="fileInput" type="file" style="display:none">

const ZH_EN = {};
DICT_RAW.trim().split('\n').forEach(line => {
  const t = line.trim(); if (!t) return;
  const i = t.indexOf('|'); if (i < 0) return;
  const zh = t.slice(0, i).trim();
  const ens = t.slice(i + 1).split(',').map(s => s.trim()).filter(Boolean);
  if (zh && ens.length) ZH_EN[zh] = ens;
});
const EN_ZH = {};
for (const [zh, ens] of Object.entries(ZH_EN))
  for (const en of ens) (EN_ZH[en] ||= []).push(zh);
const ZH_WORDS = new Set(Object.keys(ZH_EN));

const CJK_RE = /[\u3040-\u30ff\uac00-\ud7af\u4e00-\u9fff]/;
function tokenizeCJK(s){
  const out = []; let i = 0;
  while (i < s.length){
    const ch = s[i];
    if (/\s/.test(ch)){ i++; continue; }
    if (CJK_RE.test(ch)){
      let matched = ch;
      for (let L = Math.min(6, s.length - i); L >= 2; L--){
        const cand = s.slice(i, i + L);
        if (!/^[\u3040-\u30ff\uac00-\ud7af\u4e00-\u9fff]+$/.test(cand)) continue;
        if (ZH_WORDS.has(cand)){ matched = cand; break; }
      }
      out.push(matched); i += matched.length;
    } else if (/[A-Za-z0-9]/.test(ch)){
      let j = i;
      while (j < s.length && /[A-Za-z0-9'’\-]/.test(s[j])) j++;
      out.push(s.slice(i, j)); i = j;
    } else i++;
  }
  return out;
}
function tokenizeLatin(text){ return text.match(/[\p{L}\p{N}][\p{L}\p{N}'’\-]*/gu) || []; }
function tokenize(text, lang){ return isCJK(lang) ? tokenizeCJK(text) : tokenizeLatin(text); }

function stem(w){
  w = w.toLowerCase();
  if (w.length > 4){
    if (w.endsWith('ies')) return w.slice(0,-3)+'y';
    if (w.endsWith('es')) return w.slice(0,-2);
    if (w.endsWith('ing')) return w.slice(0,-3);
    if (w.endsWith('ed')) return w.slice(0,-2);
    if (w.endsWith('s') && !w.endsWith('ss')) return w.slice(0,-1);
  }
  return w;
}
function dictScore(a, b, la, lb){
  const aZH=la.startsWith('zh'), bZH=lb.startsWith('zh');
  const aEN=la.startsWith('en'), bEN=lb.startsWith('en');
  let s=0; const al=a.toLowerCase(), bl=b.toLowerCase();
  if (aZH && bEN){ const L=ZH_EN[a]; if (L){ if (L.includes(bl)) s+=8; else if (L.some(x=>stem(x)===stem(bl))) s+=6; } }
  else if (aEN && bZH){ const L=EN_ZH[al]; if (L && L.includes(b)) s+=8; else { const L2=EN_ZH[stem(al)]; if (L2 && L2.includes(b)) s+=6; } }
  if (al===bl) s+=3;
  return s;
}
function alignDP(src, tgt, la, lb){
  const n=src.length, m=tgt.length;
  if (!n||!m) return [];
  if (n===1&&m===1) return [[0,0]];
  const S=[];
  for (let i=0;i<n;i++){ const row=[];
    for (let j=0;j<m;j++){
      const pi=n>1?i/(n-1):0.5, pj=m>1?j/(m-1):0.5;
      row.push(-Math.abs(pi-pj)*2.2 + dictScore(src[i], tgt[j], la, lb));
    } S.push(row);
  }
  const GAP=-0.55, MATCH=0.9;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  const bt=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for (let i=1;i<=n;i++){ dp[i][0]=dp[i-1][0]+GAP; bt[i][0]=2; }
  for (let j=1;j<=m;j++){ dp[0][j]=dp[0][j-1]+GAP; bt[0][j]=3; }
  for (let i=1;i<=n;i++) for (let j=1;j<=m;j++){
    const d=dp[i-1][j-1]+S[i-1][j-1]+MATCH, u=dp[i-1][j]+GAP, l=dp[i][j-1]+GAP;
    let best=d, dir=1;
    if (u>best){ best=u; dir=2; } if (l>best){ best=l; dir=3; }
    dp[i][j]=best; bt[i][j]=dir;
  }
  const pairs=[]; let i=n, j=m;
  while (i>0 && j>0){
    const dir=bt[i][j];
    if (dir===1){ pairs.push([i-1,j-1]); i--; j--; }
    else if (dir===2) i--; else j--;
  }
  return pairs.reverse();
}

async function translate(text, from, to){
  const sl = from.split('-')[0], tl = to.split('-')[0];
  try {
    const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sl}|${tl}`);
    const d = await r.json();
    const out = d?.responseData?.translatedText;
    if (out && !/^MYMEMORY WARNING/i.test(out)) return out;
  } catch(_){}
  try {
    const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);
    const d = await r.json();
    return (d[0] || []).map(x => x && x[0]).filter(Boolean).join('');
  } catch(_){}
  throw new Error('翻译失败');
}

/* ===== 语音合成（原生 TTS + 浏览器 TTS 双分支） ===== */
async function speak(text, lang){
  const TTS = getNativeTTS();
  if (isNativePlatform() && TTS){
    try {
      await TTS.stop();
      await TTS.speak({ text, lang, rate: 0.92, pitch: 1.0, volume: 1.0, category: 'ambient' });
      return;
    } catch(e){ console.warn('[tts] native speak failed:', e); }
  }
  if (!('speechSynthesis' in window)){ toast('设备不支持朗读'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = 0.92;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => x.lang === lang) || vs.find(x => x.lang.split('-')[0] === lang.split('-')[0]);
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

async function speakWord(word, lang, el){
  const TTS = getNativeTTS();
  if (isNativePlatform() && TTS){
    try {
      await TTS.stop();
      await TTS.speak({ text: word, lang, rate: 0.85, pitch: 1.0, volume: 1.0, category: 'ambient' });
      return;
    } catch(e){ console.warn('[tts] native word failed:', e); }
  }
  if (!('speechSynthesis' in window)){ toast('设备不支持朗读'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = lang; u.rate = 0.85;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => x.lang === lang) || vs.find(x => x.lang.split('-')[0] === lang.split('-')[0]);
  if (v) u.voice = v;
  el?.classList.add('speaking');
  u.onend = () => el?.classList.remove('speaking');
  u.onerror = () => el?.classList.remove('speaking');
  speechSynthesis.speak(u);
}

/* ===== 状态 ===== */
const state = {
  user: null, profile: null, room: null,
  roomMembers: [], messages: [],
  langA: 'zh-CN', langB: 'en-US',
  speaker: 'A', autoSpeak: true,
};
let realtimeChannel = null;
let pendingRoleTarget = null;

function myMember(){ return state.roomMembers.find(m => m.user_id === state.user?.id); }
function myRole(){ return myMember()?.role || 'member'; }
function canManage(target){
  if (!target) return false;
  if (target.user_id === state.user?.id) return false;
  if (target.role === 'owner') return false;
  const r = myRole();
  if (r === 'owner') return true;
  if (r === 'admin' && target.role === 'member') return true;
  return false;
}
function canSetRole(target){
  if (!target) return false;
  if (target.user_id === state.user?.id) return false;
  if (target.role === 'owner') return false;
  return myRole() === 'owner';
}

function setLoginMsg(msg, type){
  const el = $('loginMsg');
  el.textContent = msg;
  el.className = 'login-msg' + (type ? ' ' + type : '');
}
$('btnLogin').addEventListener('click', async () => {
  const email = $('authEmail').value.trim();
  const password = $('authPassword').value;
  if (!email || !password){ setLoginMsg('请填写邮箱和密码', 'err'); return; }
  setLoginMsg('登录中…');
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) setLoginMsg(error.message, 'err');
  else setLoginMsg('登录成功', 'ok');
});
$('btnRegister').addEventListener('click', async () => {
  const email = $('authEmail').value.trim();
  const password = $('authPassword').value;
  const display_name = $('authName').value.trim();
  if (!email || password.length < 6){ setLoginMsg('邮箱有效且密码至少 6 位', 'err'); return; }
  setLoginMsg('注册中…');
  const { data, error } = await sb.auth.signUp({
    email, password,
    options: { data: { display_name: display_name || email.split('@')[0] } }
  });
  if (error) setLoginMsg(error.message, 'err');
  else if (data.user && !data.session) setLoginMsg('注册成功，请查收邮箱验证邮件', 'ok');
  else setLoginMsg('注册成功，请点登录', 'ok');
});
$('btnLogout').addEventListener('click', async () => {
  localStorage.removeItem('lastRoomId');
  await sb.auth.signOut(); location.reload();
});

sb.auth.onAuthStateChange(async (event, session) => {
  if (session?.user){
    state.user = session.user;
    const { data } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    state.profile = data || { id: session.user.id, email: session.user.email, display_name: session.user.email };
    $('userName').textContent = state.profile.display_name || state.profile.email;

    const params = new URLSearchParams(location.search);
    const inviteCode = params.get('room');
    const lastRoomId = localStorage.getItem('lastRoomId');

    if (inviteCode){
      await joinRoomByCode(inviteCode, true);
      history.replaceState(null, '', location.pathname);
    } else if (lastRoomId){
      const { data: mem } = await sb.from('room_members')
        .select('room_id').eq('room_id', lastRoomId).eq('user_id', session.user.id).maybeSingle();
      if (mem) await enterRoom(lastRoomId);
      else { localStorage.removeItem('lastRoomId'); show('roomsView'); await loadRooms(); }
    } else {
      show('roomsView');
      await loadRooms();
    }
  } else {
    state.user = null; state.profile = null;
    show('loginView');
  }
});

async function loadRooms(){
  const { data, error } = await sb
    .from('room_members')
    .select('room_id, role, rooms!inner(id, code, name, owner_id)')
    .eq('user_id', state.user.id);
  if (error){ toast('加载房间失败：' + error.message); return; }
  const list = $('roomList');
  if (!data.length){
    list.innerHTML = `<div class="empty-tip">还没有房间<br>点上方按钮创建一个，或用邀请码加入</div>`;
    return;
  }
  list.innerHTML = data.map(r => {
    const isOwner = r.role === 'owner';
    return `<div class="room-item" data-id="${r.rooms.id}">
      <div class="name">${esc(r.rooms.name)}</div>
      <div class="code">${esc(r.rooms.code)}</div>
      ${isOwner ? `<button class="del-room" data-del="${r.rooms.id}">🗑</button>` : ''}
    </div>`;
  }).join('');
  list.querySelectorAll('.room-item').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('.del-room')) return;
      enterRoom(el.dataset.id);
    });
  });
  list.querySelectorAll('.del-room').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const roomId = btn.dataset.del;
      const roomName = btn.closest('.room-item').querySelector('.name').textContent;
      if (!confirm(`确定删除房间「${roomName}」？`)) return;
      const { error } = await sb.from('rooms').delete().eq('id', roomId);
      if (error){ toast('删除失败：' + error.message); return; }
      toast('房间已删除');
      if (localStorage.getItem('lastRoomId') === roomId) localStorage.removeItem('lastRoomId');
      await loadRooms();
    });
  });
}

$('btnCreateRoom').addEventListener('click', async () => {
  const name = prompt('房间名称', '我的房间');
  if (!name) return;
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  const { data: room, error: e1 } = await sb.from('rooms').insert({
    code, name, owner_id: state.user.id
  }).select().single();
  if (e1){ toast('创建房间失败：' + e1.message); return; }
  const { error: e2 } = await sb.from('room_members').insert({
    room_id: room.id, user_id: state.user.id, role: 'owner', status: 'online'
  });
  if (e2){ toast('加入房间失败：' + e2.message); return; }
  toast('房间已创建');
  await enterRoom(room.id);
});

  if (code.length !== 6){ toast('邀请码 6 位'); return; }
  $('joinModal').classList.remove('on');

async function joinRoomByCode(code, silent = false){
  const { data: room, error } = await sb.from('rooms').select('*').eq('code', code).single();
  if (error || !room){ if (!silent) toast('邀请码无效'); return; }
  const { data: existing } = await sb.from('room_members')
    .select('*').eq('room_id', room.id).eq('user_id', state.user.id).maybeSingle();
  if (!existing){
    const { error: e2 } = await sb.from('room_members').insert({
      room_id: room.id, user_id: state.user.id, role: 'member', status: 'online'
    });
    if (e2){ toast('加入失败：' + e2.message); return; }
  } else {
    await sb.from('room_members').update({ status: 'online', last_seen: new Date().toISOString() })
      .eq('room_id', room.id).eq('user_id', state.user.id);
  }
  if (!silent) toast('已加入房间');
  show('roomsView');
  await loadRooms();
  await enterRoom(room.id);
}

async function enterRoom(roomId){
  if (state.room){
    await sb.from('room_members').update({ status: 'offline' })
      .eq('room_id', state.room.id).eq('user_id', state.user.id);
    if (realtimeChannel) sb.removeChannel(realtimeChannel);
  }
  const { data: room } = await sb.from('rooms').select('*').eq('id', roomId).single();
  if (!room){ toast('房间不存在'); localStorage.removeItem('lastRoomId'); return; }
  state.room = room;
  localStorage.setItem('lastRoomId', roomId);

  const { data: msgs } = await sb.from('messages')
    .select('*, profiles!inner(display_name)')
    .eq('room_id', roomId)
    .order('created_at', { ascending: true })
    .limit(100);
  state.messages = (msgs || []).map(m => {
    const srcTokens = tokenize(m.text, m.src_lang || state.langA);
    const tgtTokens = m.translation ? tokenize(m.translation, m.tgt_lang || state.langB) : [];
    const pairs = m.pairs || (tgtTokens.length ? alignDP(srcTokens, tgtTokens, m.src_lang, m.tgt_lang) : []);
    return {
      id: m.id, text: m.text, translation: m.translation,
      srcLang: m.src_lang, tgtLang: m.tgt_lang,
      srcTokens, tgtTokens, pairs,
      user_id: m.user_id, who: m.profiles?.display_name || '匿名',
      created_at: m.created_at, status: 'ok',
      file_url: m.file_url, file_name: m.file_name, file_type: m.file_type, file_size: m.file_size,
    };
  });
  $('roomTitle').textContent = room.name;
  updateSpeakerLabels();
  renderMessages();
  await sb.from('room_members').update({ status: 'online', last_seen: new Date().toISOString() })
    .eq('room_id', roomId).eq('user_id', state.user.id);
  await loadMembers();
  subscribeRoom(roomId);
  show('roomView');
}

function subscribeRoom(roomId){
  realtimeChannel = sb.channel('room-' + roomId)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${roomId}` },
      async payload => {
        const m = payload.new;
        const { data: p } = await sb.from('profiles').select('display_name').eq('id', m.user_id).single();
        const srcTokens = tokenize(m.text, m.src_lang);
        const tgtTokens = m.translation ? tokenize(m.translation, m.tgt_lang) : [];
        const pairs = m.pairs || (tgtTokens.length ? alignDP(srcTokens, tgtTokens, m.src_lang, m.tgt_lang) : []);
        state.messages.push({
          file_url: m.file_url, file_name: m.file_name, file_type: m.file_type, file_size: m.file_size,
          id: m.id, text: m.text, translation: m.translation,
          srcLang: m.src_lang, tgtLang: m.tgt_lang,
          srcTokens, tgtTokens, pairs,
          user_id: m.user_id, who: p?.display_name || '匿名',
          created_at: m.created_at, status: 'ok',
        });
        renderMessages();
      })
    .on('postgres_changes',
      { event: 'DELETE', schema: 'public', table: 'messages', filter: `room_id=eq.${roomId}` },
      payload => {
        state.messages = state.messages.filter(m => m.id !== payload.old.id);
        renderMessages();
      })
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'room_members', filter: `room_id=eq.${roomId}` },
      () => loadMembers())
    .subscribe();
}

async function loadMembers(){
  const { data } = await sb.from('room_members')
    .select('*, profiles!inner(display_name, email)')
    .eq('room_id', state.room.id);
  state.roomMembers = data || [];
  $('memberList').innerHTML = state.roomMembers.map(m => {
    const name = m.profiles?.display_name || m.profiles?.email || '匿名';
    const isMe = m.user_id === state.user.id;
    const isOwner = m.role === 'owner';
    const isAdmin = m.role === 'admin';
    const manageThis = canManage(m);
    const setRoleThis = canSetRole(m);
    const roleBadge = isOwner
      ? `<span class="member-role owner">房主</span>`
      : (isAdmin ? `<span class="member-role admin">管理</span>` : '');
    return `<div class="member-item">
      <span class="member-dot ${m.status}"></span>
      <span class="member-name">${esc(name)}${isMe ? ' (我)' : ''}</span>
      ${roleBadge}
      ${(manageThis || setRoleThis) ? `
        <div class="member-actions">
          ${setRoleThis ? `<button data-act="role" data-id="${m.user_id}">⚙</button>` : ''}
          ${manageThis ? `<button data-act="mute" data-id="${m.user_id}">${m.status === 'muted' ? '🔈' : '🔇'}</button>` : ''}
          ${manageThis ? `<button data-act="kick" data-id="${m.user_id}">✕</button>` : ''}
        </div>` : ''}
    </div>`;
  }).join('');
  $('memberList').querySelectorAll('button[data-act]').forEach(btn => {
    btn.addEventListener('click', () => handleMemberAction(btn.dataset.act, btn.dataset.id));
  });
}

async function handleMemberAction(act, uid){
  const target = state.roomMembers.find(m => m.user_id === uid);
  if (!target) return;
  if (act === 'mute'){
    if (!canManage(target)){ toast('无权操作'); return; }
    const newStatus = target.status === 'muted' ? 'online' : 'muted';
    const { error } = await sb.from('room_members').update({ status: newStatus })
      .eq('room_id', state.room.id).eq('user_id', uid);
    if (error){ toast('操作失败：' + error.message); return; }
    toast(newStatus === 'muted' ? '已禁言' : '已解除禁言');
  } else if (act === 'kick'){
    if (!canManage(target)){ toast('无权操作'); return; }
    if (!confirm(`确定把「${target.profiles?.display_name || '该成员'}」移出房间？`)) return;
    const { error } = await sb.from('room_members').delete()
      .eq('room_id', state.room.id).eq('user_id', uid);
    if (error){ toast('操作失败：' + error.message); return; }
    toast('已移出');
  } else if (act === 'role'){
    if (!canSetRole(target)){ toast('无权操作'); return; }
    openRoleModal(target);
  }
}

function openRoleModal(target){
  pendingRoleTarget = target;
  const name = target.profiles?.display_name || target.profiles?.email || '该成员';
  $('roleModalTarget').textContent = `为「${name}」设置权限`;
  $('roleModal').classList.add('on');
}

document.querySelectorAll('#roleModal .role-option').forEach(opt => {
  opt.addEventListener('click', async () => {
    if (!pendingRoleTarget) return;
    const newRole = opt.dataset.role;
    if (newRole === pendingRoleTarget.role){ $('roleModal').classList.remove('on'); return; }
    const { error } = await sb.from('room_members')
      .update({ role: newRole })
      .eq('room_id', state.room.id)
      .eq('user_id', pendingRoleTarget.user_id);
    if (error){ toast('设置失败：' + error.message); return; }
    toast(newRole === 'admin' ? '已设为管理员' : '已设为普通成员');
    $('roleModal').classList.remove('on');
    pendingRoleTarget = null;
    await loadMembers();
  });
});

$('btnRoleCancel').addEventListener('click', () => {
  $('roleModal').classList.remove('on');
  pendingRoleTarget = null;
});

$('btnLeave').addEventListener('click', async () => {
  if (state.room){
    await sb.from('room_members').update({ status: 'offline' })
      .eq('room_id', state.room.id).eq('user_id', state.user.id);
  }
  if (realtimeChannel) sb.removeChannel(realtimeChannel);
  localStorage.removeItem('lastRoomId');
  state.room = null;
  state.messages = [];
  show('roomsView');
  await loadRooms();
});

$('btnSidebar').addEventListener('click', () => $('sidebar').classList.toggle('on'));
$('btnFile').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file || !state.room) return;
  if (file.size > 50 * 1024 * 1024){ toast('文件不能超过 50MB'); return; }
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  const path = `${state.user.id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  toast('上传中…');
  const { error } = await sb.storage.from('chat-files').upload(path, file);
  if (error){ toast('上传失败：' + error.message); return; }
  const { data: urlData } = sb.storage.from('chat-files').getPublicUrl(path);
  const fileUrl = urlData.publicUrl;
  const srcLang = state.speaker === 'A' ? state.langA : state.langB;
  const tgtLang = state.speaker === 'A' ? state.langB : state.langA;
  const text = '📎 ' + file.name;
  const { error: e2 } = await sb.from('messages').insert({
    room_id: state.room.id,
    user_id: state.user.id,
    text,
    src_lang: srcLang,
    tgt_lang: tgtLang,
    translation: text,
    pairs: [],
    file_url: fileUrl,
    file_name: file.name,
    file_type: file.type || 'application/octet-stream',
    file_size: file.size,
  });
  if (e2){ toast('发送失败：' + e2.message); return; }
  toast('已发送');
});
$('btnClearRoom').addEventListener('click', async () => {
  if (!state.room) return;
  if (myRole() !== 'owner'){ toast('只有房主可以清空'); return; }
  if (!confirm('清空本房间所有消息？此操作不可恢复')) return;
  const { error } = await sb.from('messages').delete().eq('room_id', state.room.id);
  if (error){ toast('清空失败：' + error.message); return; }
  state.messages = [];
  renderMessages();
  toast('已清空');
});

$('btnInvite').addEventListener('click', async () => {
  if (!state.room) return;
  const url = `${PUBLIC_BASE_URL}/?room=${state.room.code}`;
  $('inviteLink').textContent = url;
  const qrImg = $('qrImg');
  qrImg.removeAttribute('src');
  let qrOk = false;
  try {
    if (typeof QRCode !== 'undefined' && QRCode.toDataURL) {
      const dataUrl = await QRCode.toDataURL(url, { width: 360, margin: 1, color: { dark: '#0d0f14', light: '#ffffff' } });
      qrImg.src = dataUrl;
      qrOk = true;
    }
  } catch(e){ console.warn(e); }
  if (!qrOk) qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=10&data=${encodeURIComponent(url)}`;
  $('inviteModal').classList.add('on');
});
$('btnCloseInvite').addEventListener('click', () => $('inviteModal').classList.remove('on'));

async function robustCopy(str){
  try {
    if (navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(str); return true;
    }
  } catch(_){}
  try {
    const ta = document.createElement('textarea');
    ta.value = str;
    ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, str.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(_){ return false; }
}
$('btnCopyLink').addEventListener('click', async () => {
  const url = $('inviteLink').textContent;
  const ok = await robustCopy(url);
  toast(ok ? '✓ 已复制' : '请手动选中复制');
});

function pairColor(k){
  const h = (k * 137.508) % 360;
  return `hsl(${h.toFixed(0)},72%,62%)`;
}
function renderToks(tokens, map, side){
  return tokens.map((t, i) => {
    const hit = map.get(i);
    const k = hit ? hit.k : -1;
    const c = hit ? pairColor(hit.k) : '#3a4356';
    return `<span class="tok" data-k="${k}" data-side="${side}" data-w="${esc(t)}" style="--c:${c}">
      <span class="w">${esc(t)}</span><span class="bar"></span><span class="n">${i + 1}</span>
    </span>`;
  }).join('');
}
function buildMessageHTML(m){
  const srcMap = new Map(), tgtMap = new Map();
  (m.pairs || []).forEach(([i, j], k) => { srcMap.set(i, { j, k }); tgtMap.set(j, { i, k }); });
  const time = new Date(m.created_at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  const copyText = m.translation
    ? `【${langShort(m.srcLang)}】${m.text}\n【${langShort(m.tgtLang)}】${m.translation}`
    : `【${langShort(m.srcLang)}】${m.text}`;
  const myRoleNow = myRole();
  const canDel = m.user_id === state.user?.id || myRoleNow === 'owner' || myRoleNow === 'admin';
  const delBtn = canDel ? `<button class="del-msg" data-del="${m.id}">✕</button>` : '';
   let fileBlock = '';
  if (m.file_url){
    var safeUrl = esc(m.file_url);
    var ft = m.file_type || '';
    var fname = esc(m.file_name || '文件');
    var fsize = Math.round((m.file_size||0)/1024);
    if (ft.startsWith('image/')){
      fileBlock = `<div style="margin:8px 0"><img src="${safeUrl}" style="max-width:100%;max-height:300px;border-radius:8px;cursor:pointer" data-imgurl="${safeUrl}"></div>`;
    } else if (ft.startsWith('video/')){
      fileBlock = `<div style="margin:8px 0"><video src="${safeUrl}" controls playsinline preload="metadata" style="max-width:100%;max-height:320px;border-radius:8px;background:#000"></video></div>`;
    } else if (ft.startsWith('audio/')){
      fileBlock = `<div style="margin:8px 0"><audio src="${safeUrl}" controls preload="metadata" style="width:100%"></audio></div>`;
    } else {
      fileBlock = `<div style="margin:8px 0"><a href="${safeUrl}" target="_blank" style="color:var(--accent);text-decoration:none">📎 ${fname} (${fsize} KB)</a></div>`;
    }
  }
  
  let html = `
    <div class="msg-header"><span class="who">${esc(m.who)}</span><span class="time">${time}</span></div>
    ${fileBlock}
    <div class="row">
      <span class="chip" style="--c:${langColor(m.srcLang)}">${esc(langShort(m.srcLang))}</span>
      <div class="toks">${renderToks(m.srcTokens, srcMap, 'src')}</div>
      <div class="acts"><button class="spkbtn" data-speak="${esc(m.text)}" data-lang="${m.srcLang}">🔊</button></div>
    </div>`;
  if (m.translation){
    html += `
    <div class="row">
      <span class="chip" style="--c:${langColor(m.tgtLang)}">${esc(langShort(m.tgtLang))}</span>
      <div class="toks">${renderToks(m.tgtTokens, tgtMap, 'tgt')}</div>
      <div class="acts">
        <button class="spkbtn" data-speak="${esc(m.translation)}" data-lang="${m.tgtLang}">🔊</button>
        <button class="copybtn" data-copy="${esc(copyText)}">📋</button>
      </div>
    </div>`;
  }
  return `<div class="msg${m.user_id === state.user?.id ? ' own' : ''}" data-id="${m.id}">${delBtn}${html}</div>`;
}
function renderMessages(){
  const chatEl = $('chat');
  chatEl.innerHTML = state.messages.map(buildMessageHTML).join('');
  chatEl.scrollTop = chatEl.scrollHeight;
}

$('chat').addEventListener('click', async e => {
  const imgClick = e.target.closest('img[data-imgurl]');
  if (imgClick){
    window.open(imgClick.dataset.imgurl, '_blank');
    return;
  }
  const delMsg = e.target.closest('.del-msg');
  if (delMsg){
    e.stopPropagation();
    if (!confirm('删除这条消息？')) return;
    const { error } = await sb.from('messages').delete().eq('id', delMsg.dataset.del);
    if (error){ toast('删除失败：' + error.message); return; }
    state.messages = state.messages.filter(m => m.id !== delMsg.dataset.del);
    renderMessages();
    toast('已删除');
    return;
  }
  const spk = e.target.closest('.spkbtn');
  if (spk){ speak(spk.dataset.speak, spk.dataset.lang); return; }
  const cp = e.target.closest('.copybtn');
  if (cp){ const ok = await robustCopy(cp.dataset.copy); if (ok) toast('已复制'); return; }
  const tok = e.target.closest('.tok');
  if (tok && tok.dataset.w){
    const msgEl = tok.closest('.msg');
    const msg = state.messages.find(m => m.id === msgEl?.dataset.id);
    const talkLang = tok.dataset.side === 'src' ? msg?.srcLang : msg?.tgtLang;
    if (talkLang) speakWord(tok.dataset.w, talkLang, tok);
    if (tok.dataset.k !== '-1'){
      $('chat').querySelectorAll('.tok.hl').forEach(x => x.classList.remove('hl'));
      $('chat').querySelectorAll(`.tok[data-k="${tok.dataset.k}"]`).forEach(x => x.classList.add('hl'));
    }
  }
});

function updateSpeakerLabels(){
  const btns = $('speakers').querySelectorAll('.spk');
  btns[0].textContent = 'A · ' + langName(state.langA);
  btns[1].textContent = 'B · ' + langName(state.langB);
  btns.forEach(b => b.classList.toggle('active', b.dataset.side === state.speaker));
}
$('speakers').addEventListener('click', e => {
  const b = e.target.closest('.spk'); if (!b) return;
  state.speaker = b.dataset.side;
  updateSpeakerLabels();
});

$('txt').addEventListener('input', () => { $('btnSend').disabled = !$('txt').value.trim(); });
$('txt').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing){ e.preventDefault(); send(); }
});
$('btnSend').addEventListener('click', send);

async function send(){
  const text = $('txt').value.trim();
  if (!text || !state.room) return;
  $('txt').value = '';
  $('btnSend').disabled = true;
  const srcLang = state.speaker === 'A' ? state.langA : state.langB;
  const tgtLang = state.speaker === 'A' ? state.langB : state.langA;
  let translation = null, pairs = null;
  try {
    translation = await translate(text, srcLang, tgtLang);
    const srcTokens = tokenize(text, srcLang);
    const tgtTokens = tokenize(translation, tgtLang);
    pairs = alignDP(srcTokens, tgtTokens, srcLang, tgtLang);
  } catch(e){ console.warn('翻译失败', e); }
  const { error } = await sb.from('messages').insert({
    room_id: state.room.id, user_id: state.user.id, text,
    src_lang: srcLang, tgt_lang: tgtLang, translation, pairs,
  });
  if (error){ toast('发送失败：' + error.message); return; }
  if (state.autoSpeak && translation) setTimeout(() => speak(translation, tgtLang), 100);
}

/* ===== 语音识别（原生 + Web 双分支） ===== */
let rec = null, recActive = false, finalTxt = '';

$('btnMic').addEventListener('click', async () => {
  if (isNativePlatform() && getNativeSR()) return handleNativeMic();
  return handleWebMic();
});

async function handleNativeMic(){
  const SR = getNativeSR();
  if (recActive){
    try { await SR.stop(); } catch(_){}
    recActive = false;
    $('btnMic').classList.remove('rec');
    $('btnMic').textContent = '🎤';
    return;
  }
  try {
    const perm = await SR.requestPermissions();
    if (perm.speechRecognition !== 'granted'){ toast('请允许麦克风权限'); return; }
  } catch(e){ console.warn(e); }

  recActive = true;
  finalTxt = '';
  $('txt').value = '';
  $('btnMic').classList.add('rec');
  $('btnMic').textContent = '■';
  const lang = state.speaker === 'A' ? state.langA : state.langB;

  try {
    await SR.removeAllListeners();
    SR.addListener('partialResults', data => {
      const t = (data.matches && data.matches[0]) || '';
      if (t){ finalTxt = t; $('txt').value = t; $('btnSend').disabled = false; }
    });
  } catch(e){ console.warn(e); }

  try {
    const result = await SR.start({ language: lang, maxResults: 1, partialResults: true, popup: false });
    recActive = false;
    $('btnMic').classList.remove('rec');
    $('btnMic').textContent = '🎤';
    const text = (result && result.matches && result.matches[0]) || finalTxt || $('txt').value.trim();
    if (text){ $('txt').value = text; $('btnSend').disabled = false; send(); }
  } catch(e){
    console.error('原生识别失败', e);
    recActive = false;
    $('btnMic').classList.remove('rec');
    $('btnMic').textContent = '🎤';
    toast('语音识别失败：' + (e.message || e));
  }
}

async function handleWebMic(){
  if (recActive){ try { rec.stop(); } catch(_){} return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ toast('此浏览器不支持语音识别'); return; }
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    s.getTracks().forEach(t => t.stop());
  } catch(e){ toast('麦克风权限被拒绝'); return; }
  rec = new SR();
  rec.lang = state.speaker === 'A' ? state.langA : state.langB;
  rec.continuous = false;
  rec.interimResults = true;
  finalTxt = '';
  rec.onstart = () => { recActive = true; $('btnMic').classList.add('rec'); $('btnMic').textContent = '■'; };
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalTxt += t;
      else interim += t;
    }
    $('txt').value = (finalTxt + interim).trim();
    $('btnSend').disabled = !$('txt').value.trim();
  };
  rec.onend = () => {
    recActive = false;
    $('btnMic').classList.remove('rec');
    $('btnMic').textContent = '🎤';
    if (finalTxt.trim()) send();
  };
  rec.onerror = e => {
    if (e.error === 'network') toast('语音识别需要联网');
    else if (e.error === 'not-allowed') toast('麦克风权限被拒绝');
  };
  try { rec.start(); } catch(e){ console.warn(e); }
}

(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) show('loginView');
})();
