name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Inject permissions and queries
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()

          perms = '''    <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
          '''
          if 'android.permission.RECORD_AUDIO' not in content:
              content = content.replace('<application', perms + '<application', 1)

          queries = '''    <queries>
              <intent>
                  <action android:name="android.speech.RecognitionService" />
              </intent>
          </queries>
          '''
          if '<queries>' not in content:
              content = content.replace('<application', queries + '<application', 1)

          with open(path, 'w') as f:
              f.write(content)
          print("=== FINAL MANIFEST ===")
          print(content)
          PY

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
